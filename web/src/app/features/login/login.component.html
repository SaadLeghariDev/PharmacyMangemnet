<section class="login-page">
  <div class="login-card">
    <div class="brand-block">
      <span class="mark" aria-hidden="true">P</span>
      <h1>Pharmacy MS</h1>
    </div>
    <p class="lede">Sign in to the counter and inventory workspace.</p>

    <form class="form" (submit)="submit($event)" autocomplete="on">
      <label class="field">
        <span class="label">Username <abbr title="required">*</abbr></span>
        <input
          type="text"
          name="username"
          autocomplete="username"
          [(ngModel)]="username"
          [disabled]="busy()"
          required
        />
      </label>

      <label class="field">
        <span class="label">Password <abbr title="required">*</abbr></span>
        <input
          type="password"
          name="password"
          autocomplete="current-password"
          [(ngModel)]="password"
          [disabled]="busy()"
          required
        />
      </label>

      @if (error()) {
        <p class="form-error" role="alert">{{ error() }}</p>
      }

      <button class="submit" type="submit" id="login-submit" [disabled]="busy()">
        @if (busy()) {
          <span class="spinner" aria-hidden="true"></span>
        }
        Sign in
      </button>
    </form>

    <p class="hint">Development seed: admin / Admin&#64;12345</p>
  </div>
</section>
