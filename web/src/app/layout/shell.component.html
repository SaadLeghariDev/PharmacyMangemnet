<div class="shell" [class.nav-open]="navOpen()">
  <div class="nav-backdrop" (click)="closeNav()" aria-hidden="true"></div>

  <aside class="sidebar" aria-label="Main navigation" [attr.aria-hidden]="false">
    <div class="brand">
      <span class="mark" aria-hidden="true">P</span>
      <div>
        <strong>Pharmacy MS</strong>
        <small>Counter &amp; inventory</small>
      </div>
      <button type="button" class="drawer-close" aria-label="Close menu" (click)="closeNav()">×</button>
    </div>
    <nav>
      @for (group of navGroups; track group.label) {
        <div class="nav-group">
          <p class="nav-group-label">{{ group.label }}</p>
          @for (item of group.items; track item.path) {
            <a [routerLink]="item.path" routerLinkActive="active" (click)="closeNav()">
              <span class="icon" aria-hidden="true">{{ item.icon }}</span>
              <span>{{ item.label }}</span>
            </a>
          }
        </div>
      }
    </nav>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="top-left">
        <button
          type="button"
          class="menu-toggle"
          aria-label="Open menu"
          [attr.aria-expanded]="navOpen()"
          (click)="toggleNav()"
        >
          <span></span>
          <span></span>
          <span></span>
        </button>
        <div class="crumb">
          <span class="muted">Signed in as</span>
          <strong>{{ auth.user()?.fullName || auth.user()?.username }}</strong>
        </div>
      </div>
      <div class="top-actions">
        <button type="button" class="signout" (click)="logout()">Sign out</button>
      </div>
    </header>
    <div class="content">
      <router-outlet />
    </div>
  </div>
</div>
<app-snackbar />
